# Start the Streamlit app:        docker compose up --build
# Also start the FastAPI service: docker compose --profile api up --build
x-env: &env
  - API_KEY=${API_KEY:-}
  - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
  - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
  - SIREN_URL=${SIREN_URL:-}
  - SIREN_KEY=${SIREN_KEY:-}
  - POOL_RTSP=${POOL_RTSP:-}
  - HOME_CAM_URL=${HOME_CAM_URL:-}

services:
  app:                       # Streamlit front end -> http://localhost:8501
    build: .
    image: safeguard-ai
    ports: ["8501:8501"]
    environment: *env
    volumes:
      - ./data:/srv/data
      - ./config.yaml:/srv/config.yaml:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 30s
      timeout: 5s

  api:                       # FastAPI + dashboard -> http://localhost:8000  (only with --profile api)
    build: .
    image: safeguard-ai
    profiles: ["api"]
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    ports: ["8000:8000"]
    environment: *env
    volumes:
      - ./data:/srv/data
      - ./config.yaml:/srv/config.yaml:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
    # NVIDIA GPU (Linux + nvidia-container-toolkit, and a CUDA PyTorch image): see README
